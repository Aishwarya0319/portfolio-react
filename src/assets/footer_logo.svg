<!-- Aishwarya gradient wordmark -->
<svg width="220" height="40" viewBox="0 0 220 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aishwarya logo">
  <title>Aishwarya</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DF8908"/>
