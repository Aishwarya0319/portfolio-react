    </linearGradient>
  </defs>
  <text x="0" y="28"
        font-family="Poppins, Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="35" font-weight="800" letter-spacing=".35"
        fill="url(#g)">
    Aishwarya
  </text>
</svg>